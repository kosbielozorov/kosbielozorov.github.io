<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      fetchpriority="high"
      as="image"
      href="/images/portfolio.webp"
      type="image/webp"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kostiantyn Bielozorov - QA engineer</title>
    <!--
      Defaults for link-preview bots, which do not run JavaScript. data-rh marks them as
      react-helmet-async's own, so each page's Helmet tags replace them once the app runs
      (no duplicates). Keep them in step with src/info/en.js.
    -->
    <meta
      data-rh="true"
      name="description"
      content="QA engineer with knowledge of software testing, quality assurance methodologies. Strive to learn new technologies and gain new knowledge by solving problems. Worked with manual and automation web testing."
    />
    <meta
      data-rh="true"
      property="og:title"
      content="Kostiantyn Bielozorov | Manual and automation QA engineer"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="QA engineer with knowledge of software testing, quality assurance methodologies. Strive to learn new technologies and gain new knowledge by solving problems. Worked with manual and automation web testing."
    />
    <meta data-rh="true" property="og:type" content="website" />
    <meta
      data-rh="true"
      property="og:image"
      content="https://kosbielozorov.github.io/images/kos.jpg"
    />
    <meta data-rh="true" name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
